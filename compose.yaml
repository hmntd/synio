services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redmine-postgres:
        image: 'postgres:14-alpine'
        ports:
            - '${FORWARD_REDMINE_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: redmine
            POSTGRES_USER: redmine
            POSTGRES_PASSWORD: redmine_password
        volumes:
            - 'sail-redmine-postgres:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-U'
                - redmine
            retries: 3
            timeout: 5s
    redmine:
        image: 'redmine:5.1-alpine'
        ports:
            - '${FORWARD_REDMINE_PORT:-3000}:3000'
        environment:
            REDMINE_DB_POSTGRES: redmine-postgres
            REDMINE_DB_DATABASE: redmine
            REDMINE_DB_USERNAME: redmine
            REDMINE_DB_PASSWORD: redmine_password
            REDMINE_SECRET_KEY_BASE: supersecretkey_for_development_only
            REDMINE_PLUGINS_MIGRATE: 'true'
        volumes:
            - 'sail-redmine-files:/usr/src/redmine/files'
            - 'sail-redmine-plugins:/usr/src/redmine/plugins'
            - './docker/redmine/configuration.yml:/usr/src/redmine/config/configuration.yml'
            - './docker/redmine/init:/docker-entrypoint-initdb.d'
        networks:
            - sail
        depends_on:
            - redmine-postgres
        healthcheck:
            test:
                - CMD
                - wget
                - '-q'
                - '--spider'
                - 'http://localhost:3000'
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redmine-postgres:
        driver: local
    sail-redmine-files:
        driver: local
    sail-redmine-plugins:
        driver: local
    sail-redis:
        driver: local
